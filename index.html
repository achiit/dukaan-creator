<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Creator Junction — Creator Meetup</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   CREATOR JUNCTION — LIQUID GLASS UI
   ========================================================= */

:root{
  --accent:#007aff;
  --accent2:#5ac8fa;
  --bg:#f5f5f7;
  --text:#111;
  --muted:#6e6e73;
  --glass:rgba(255,255,255,.62);
  --glass-dark:rgba(255,255,255,.12);
  --border:rgba(255,255,255,.65);
  --shadow:0 25px 70px rgba(0,0,0,.12);
  --radius:28px;
  --nav-height:72px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "Segoe UI",sans-serif;
  color:var(--text);
  background:var(--bg);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

button,
input,
select,
textarea{
  font:inherit;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

/* =========================================================
   BACKGROUND
   ========================================================= */

body::before{
  content:"";
  position:fixed;
  z-index:-10;
  inset:0;
  background:
    radial-gradient(circle at 10% 10%,rgba(0,122,255,.20),transparent 28%),
    radial-gradient(circle at 90% 20%,rgba(175,82,222,.16),transparent 25%),
    radial-gradient(circle at 50% 100%,rgba(90,200,250,.20),transparent 30%);
  pointer-events:none;
}

body::after{
  content:"";
  position:fixed;
  z-index:-9;
  inset:0;
  opacity:.22;
  background-image:
    linear-gradient(rgba(255,255,255,.8) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.8) 1px,transparent 1px);
  background-size:55px 55px;
  mask-image:linear-gradient(to bottom,black,transparent 75%);
  pointer-events:none;
}

/* =========================================================
   LOADER
   ========================================================= */

.loader{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:#f5f5f7;
  transition:.7s ease;
}

.loader.hide{
  opacity:0;
  pointer-events:none;
}

.loader-logo{
  font-family:"Space Grotesk",Inter,sans-serif;
  font-size:clamp(28px,7vw,65px);
  font-weight:800;
  letter-spacing:-3px;
}

.loader-logo span{
  color:var(--accent);
}

.loader-bar{
  width:160px;
  height:4px;
  margin-top:25px;
  border-radius:20px;
  overflow:hidden;
  background:#ddd;
}

.loader-bar span{
  display:block;
  width:35%;
  height:100%;
  background:var(--accent);
  border-radius:20px;
  animation:loader 1.1s infinite ease-in-out;
}

@keyframes loader{
  from{transform:translateX(-130%)}
  to{transform:translateX(400%)}
}

/* =========================================================
   FLOATING GLASS NAV
   ========================================================= */

.top-nav{
  position:fixed;
  z-index:1000;
  top:14px;
  left:50%;
  width:min(1200px,calc(100% - 28px));
  transform:translateX(-50%);
}

.nav-glass{
  min-height:var(--nav-height);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:10px 14px 10px 20px;

  background:rgba(255,255,255,.58);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);

  border:1px solid rgba(255,255,255,.8);
  border-radius:24px;
  box-shadow:
    0 10px 45px rgba(0,0,0,.10),
    inset 0 1px 0 rgba(255,255,255,.9);
}

.brand{
  color:#111;
  text-decoration:none;
  font-family:"Space Grotesk",Inter,sans-serif;
  font-weight:800;
  font-size:20px;
  letter-spacing:-1px;
  white-space:nowrap;
}

.brand span{
  color:var(--accent);
}

.nav-links{
  display:flex;
  align-items:center;
  gap:5px;
}

.nav-links a{
  color:#333;
  text-decoration:none;
  font-size:13px;
  font-weight:600;
  padding:10px 13px;
  border-radius:14px;
  transition:.25s ease;
}

.nav-links a:hover{
  color:var(--accent);
  background:rgba(255,255,255,.75);
}

.nav-right{
  display:flex;
  align-items:center;
  gap:7px;
}

.lang-switch{
  display:flex;
  padding:3px;
  border-radius:16px;
  background:rgba(0,0,0,.06);
}

.lang-btn{
  border:0;
  cursor:pointer;
  background:transparent;
  color:#777;
  padding:7px 10px;
  border-radius:12px;
  font-size:11px;
  font-weight:800;
}

.lang-btn.active{
  color:#111;
  background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.10);
}

.color-button{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  cursor:pointer;
  background:var(--accent);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.6),
    0 5px 15px rgba(0,0,0,.12);
}

.menu-button{
  display:none;
  width:40px;
  height:40px;
  border:0;
  border-radius:14px;
  background:rgba(255,255,255,.65);
  cursor:pointer;
  font-size:20px;
}

/* =========================================================
   COLOR PANEL
   ========================================================= */

.color-panel{
  position:fixed;
  z-index:1100;
  top:92px;
  right:20px;
  width:230px;
  padding:18px;
  display:none;

  background:rgba(255,255,255,.70);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);

  border:1px solid rgba(255,255,255,.9);
  border-radius:24px;
  box-shadow:var(--shadow);
}

.color-panel.show{
  display:block;
  animation:panelIn .3s ease;
}

@keyframes panelIn{
  from{opacity:0;transform:translateY(-8px) scale(.97)}
  to{opacity:1;transform:none}
}

.color-panel h4{
  margin-bottom:14px;
  font-size:13px;
}

.color-options{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.color-dot{
  width:36px;
  height:36px;
  border:3px solid #fff;
  border-radius:50%;
  cursor:pointer;
  box-shadow:0 2px 12px rgba(0,0,0,.18);
}

.color-dot.blue{background:#007aff}
.color-dot.purple{background:#af52de}
.color-dot.pink{background:#ff2d55}
.color-dot.green{background:#34c759}
.color-dot.orange{background:#ff9500}
.color-dot.red{background:#ff3b30}

/* =========================================================
   HERO
   ========================================================= */

.hero{
  min-height:100vh;
  padding:
    calc(var(--nav-height) + 80px)
    20px
    90px;

  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.hero-content{
  width:min(1050px,100%);
  position:relative;
  z-index:5;
}

.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:9px 14px;
  border:1px solid rgba(255,255,255,.9);
  border-radius:999px;
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(20px);
  box-shadow:0 8px 30px rgba(0,0,0,.08);
  color:#555;
  font-size:11px;
  font-weight:800;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.live{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 5px rgba(0,122,255,.12);
  animation:livePulse 1.5s infinite;
}

@keyframes livePulse{
  50%{box-shadow:0 0 0 10px rgba(0,122,255,0)}
}

.hero-title{
  margin-top:27px;
  font-family:"Space Grotesk",Inter,sans-serif;
  font-size:clamp(52px,12vw,150px);
  line-height:.82;
  letter-spacing:-8px;
  font-weight:800;
  color:#101010;

  text-shadow:
    0 1px 0 #fff,
    0 10px 35px rgba(0,0,0,.12);

  transform-style:preserve-3d;
  transition:transform .2s ease-out;
}

.hero-title span{
  color:var(--accent);
  text-shadow:
    0 1px 0 #fff,
    0 10px 35px rgba(0,122,255,.22);
}

.hero-description{
  width:min(720px,100%);
  margin:30px auto 0;
  color:#626267;
  line-height:1.7;
  font-size:clamp(14px,2vw,18px);
}

.hero-description strong{
  color:#111;
}

.hero-actions{
  margin-top:30px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.glass-btn{
  min-height:50px;
  padding:0 22px;
  border:1px solid rgba(255,255,255,.85);
  border-radius:16px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  text-decoration:none;
  cursor:pointer;
  font-size:13px;
  font-weight:800;
  transition:.3s ease;

  background:rgba(255,255,255,.65);
  color:#111;

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  box-shadow:
    0 10px 25px rgba(0,0,0,.08),
    inset 0 1px 0 rgba(255,255,255,.9);
}

.glass-btn.primary{
  background:var(--accent);
  color:#fff;
  border-color:transparent;
  box-shadow:
    0 12px 30px color-mix(in srgb,var(--accent) 30%,transparent);
}

.glass-btn:hover{
  transform:translateY(-4px) scale(1.02);
}

.price-pill{
  margin:28px auto 0;
  width:max-content;
  max-width:95%;
  padding:11px 17px;
  border-radius:999px;
  background:rgba(255,255,255,.65);
  border:1px solid rgba(255,255,255,.85);
  backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
  font-size:12px;
  font-weight:800;
}

.price-pill b{
  color:var(--accent);
  font-size:16px;
}

/* =========================================================
   FLOATING GLASS OBJECTS
   ========================================================= */

.orb{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  filter:blur(1px);
  opacity:.8;
}

.orb.one{
  width:280px;
  height:280px;
  left:-100px;
  top:25%;
  background:radial-gradient(circle at 30% 30%,
    color-mix(in srgb,var(--accent) 65%,white),
    transparent 70%);
  animation:floatOne 8s ease-in-out infinite;
}

.orb.two{
  width:240px;
  height:240px;
  right:-80px;
  top:15%;
  background:radial-gradient(circle at 40% 40%,
    rgba(175,82,222,.45),
    transparent 70%);
  animation:floatTwo 9s ease-in-out infinite;
}

.orb.three{
  width:180px;
  height:180px;
  right:20%;
  bottom:8%;
  background:radial-gradient(circle,
    rgba(90,200,250,.35),
    transparent 70%);
  animation:floatOne 10s ease-in-out infinite reverse;
}

@keyframes floatOne{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(40px,-35px)}
}

@keyframes floatTwo{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(-30px,40px)}
}

/* =========================================================
   SOCIAL GLASS ORBS
   ========================================================= */

.social-orb{
  position:absolute;
  width:72px;
  height:72px;
  display:grid;
  place-items:center;
  border-radius:23px;

  background:rgba(255,255,255,.46);
  border:1px solid rgba(255,255,255,.85);

  backdrop-filter:blur(20px) saturate(170%);
  -webkit-backdrop-filter:blur(20px) saturate(170%);

  box-shadow:
    0 20px 40px rgba(0,0,0,.10),
    inset 0 1px 0 rgba(255,255,255,.9);

  animation:socialFloat 5s ease-in-out infinite;
}

.social-orb svg{
  width:34px;
  height:34px;
  fill:#111;
}

.social-instagram{
  left:7%;
  top:30%;
}

.social-youtube{
  right:7%;
  top:28%;
  animation-delay:1s;
}

.social-facebook{
  right:13%;
  bottom:25%;
  animation-delay:2s;
}

.social-tiktok{
  left:12%;
  bottom:23%;
  animation-delay:3s;
}

@keyframes socialFloat{
  0%,100%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-22px) rotate(4deg)}
}

/* =========================================================
   BREAKING NEWS
   ========================================================= */

.news{
  position:relative;
  z-index:20;
  overflow:hidden;
  padding:11px 0;
  background:rgba(255,255,255,.55);
  border-top:1px solid rgba(255,255,255,.9);
  border-bottom:1px solid rgba(255,255,255,.9);
  backdrop-filter:blur(25px);
}

.news-track{
  display:flex;
  width:max-content;
  animation:newsMove 28s linear infinite;
}

.news-item{
  padding:0 30px;
  color:#555;
  font-size:11px;
  font-weight:800;
  letter-spacing:.7px;
  text-transform:uppercase;
}

.news-item b{
  color:var(--accent);
}

@keyframes newsMove{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

/* =========================================================
   COMMON SECTION
   ========================================================= */

section{
  padding:95px 20px;
}

.container{
  width:min(1150px,100%);
  margin:auto;
}

.section-heading{
  text-align:center;
  margin-bottom:45px;
}

.eyebrow{
  color:var(--accent);
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
}

.section-heading h2{
  margin-top:10px;
  font-family:"Space Grotesk",Inter,sans-serif;
  font-size:clamp(34px,6vw,65px);
  line-height:1;
  letter-spacing:-3px;
}

.section-heading p{
  width:min(650px,100%);
  margin:18px auto 0;
  color:var(--muted);
  line-height:1.7;
  font-size:14px;
}

/* =========================================================
   GLASS CARDS
   ========================================================= */

.glass-card{
  background:rgba(255,255,255,.52);
  border:1px solid rgba(255,255,255,.85);
  backdrop-filter:blur(25px) saturate(160%);
  -webkit-backdrop-filter:blur(25px) saturate(160%);
  box-shadow:
    0 25px 70px rgba(0,0,0,.08),
    inset 0 1px 0 rgba(255,255,255,.85);
  border-radius:var(--radius);
}

/* =========================================================
   ABOUT
   ========================================================= */

.about-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.about-card{
  padding:35px;
}

.about-icon{
  width:54px;
  height:54px;
  display:grid;
  place-items:center;
  border-radius:18px;
  background:rgba(255,255,255,.75);
  box-shadow:0 8px 25px rgba(0,0,0,.08);
  font-size:25px;
  margin-bottom:22px;
}

.about-card h3{
  font-size:21px;
  margin-bottom:10px;
}

.about-card p{
  color:var(--muted);
  line-height:1.7;
  font-size:14px;
}

/* =========================================================
   EVENT CARDS
   ========================================================= */

.event-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.event-card{
  padding:28px;
  min-height:190px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.event-card small{
  color:var(--accent);
  font-size:10px;
  font-weight:900;
  letter-spacing:2px;
}

.event-card h3{
  font-family:"Space Grotesk";
  font-size:28px;
  letter-spacing:-1px;
}

/* =========================================================
   FEATURES
   ========================================================= */

.feature-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.feature{
  padding:28px;
  min-height:210px;
  transition:.35s ease;
}

.feature:hover{
  transform:translateY(-8px);
  box-shadow:
    0 35px 80px rgba(0,0,0,.12),
    inset 0 1px 0 white;
}

.feature-icon{
  width:50px;
  height:50px;
  display:grid;
  place-items:center;
  border-radius:17px;
  background:rgba(255,255,255,.7);
  box-shadow:0 8px 20px rgba(0,0,0,.08);
  font-size:23px;
  margin-bottom:20px;
}

.feature h3{
  margin-bottom:9px;
  font-size:18px;
}

.feature p{
  color:var(--muted);
  line-height:1.65;
  font-size:13px;
}

/* =========================================================
   REGISTRATION
   ========================================================= */

.registration{
  position:relative;
}

.register-layout{
  display:grid;
  grid-template-columns:.75fr 1.25fr;
  gap:20px;
  align-items:start;
}

.price-card{
  padding:32px;
  position:sticky;
  top:105px;
}

.price-label{
  color:var(--accent);
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
}

.big-price{
  margin:15px 0;
  font-family:"Space Grotesk";
  font-size:65px;
  line-height:1;
  letter-spacing:-4px;
}

.big-price small{
  font-size:14px;
  letter-spacing:0;
  color:var(--muted);
}

.price-list{
  list-style:none;
  margin:25px 0;
}

.price-list li{
  padding:11px 0;
  color:#555;
  border-bottom:1px solid rgba(0,0,0,.07);
  font-size:13px;
}

.price-list li::before{
  content:"✓";
  margin-right:10px;
  color:var(--accent);
  font-weight:900;
}

.form-card{
  padding:32px;
}

.form-card h3{
  font-size:26px;
  letter-spacing:-1px;
}

.form-card>p{
  color:var(--muted);
  margin-top:7px;
  margin-bottom:25px;
  font-size:13px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  font-size:10px;
  font-weight:900;
  color:#555;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid rgba(0,0,0,.08);
  outline:none;
  border-radius:15px;
  padding:14px;
  background:rgba(255,255,255,.58);
  color:#111;
  transition:.25s;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent);
  background:#fff;
}

.field textarea{
  min-height:110px;
  resize:vertical;
}

.submit-btn{
  width:100%;
  border:0;
  margin-top:18px;
  min-height:52px;
  border-radius:16px;
  cursor:pointer;
  background:var(--accent);
  color:#fff;
  font-weight:900;
  box-shadow:0 12px 30px color-mix(in srgb,var(--accent) 25%,transparent);
  transition:.3s;
}

.submit-btn:hover{
  transform:translateY(-3px);
}

/* =========================================================
   FAQ
   ========================================================= */

.faq-list{
  width:min(850px,100%);
  margin:auto;
}

.faq-item{
  margin-bottom:10px;
  overflow:hidden;
}

.faq-item summary{
  list-style:none;
  cursor:pointer;
  padding:21px 23px;
  font-size:14px;
  font-weight:800;
}

.faq-item summary::-webkit-details-marker{
  display:none;
}

.faq-answer{
  padding:0 23px 22px;
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}

/* =========================================================
   CONTACT
   ========================================================= */

.contact-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.contact-card{
  padding:27px;
}

.contact-card small{
  color:var(--accent);
  font-size:10px;
  font-weight:900;
  letter-spacing:1.5px;
}

.contact-card h3{
  margin-top:8px;
  font-size:18px;
}

.contact-card a{
  color:#111;
  text-decoration:none;
}

/* =========================================================
   FOOTER
   ========================================================= */

footer{
  padding:55px 20px 35px;
  text-align:center;
}

.footer-glass{
  width:min(900px,100%);
  margin:auto;
  padding:35px;
}

.footer-logo{
  font-family:"Space Grotesk";
  font-size:28px;
  font-weight:800;
}

.footer-logo span{
  color:var(--accent);
}

.footer-links{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:15px;
  margin:22px 0;
}

.footer-links a{
  color:#666;
  text-decoration:none;
  font-size:12px;
}

.footer-copy{
  color:#999;
  font-size:11px;
}

/* =========================================================
   MODAL
   ========================================================= */

.modal{
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  align-items:center;
